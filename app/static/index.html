<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Docs Assistant</title>
<style>
  :root {
    --bg: #10141c;
    --panel: #171d28;
    --panel-2: #1d2431;
    --line: #2a3444;
    --ink: #e6ebf4;
    --muted: #8e9bb3;
    --accent: #5ddcb0;
    --accent-dim: #1d3a33;
    --warn: #ffb06b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 2.5rem 1.25rem 5rem; }

  header { margin-bottom: 2rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .35rem; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: .92rem; margin: 0; }

  form { display: grid; gap: .75rem; margin-bottom: 1.5rem; }
  .row { display: flex; gap: .6rem; flex-wrap: wrap; }
  input[type=text] {
    flex: 1 1 320px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: .8rem 1rem;
    font: inherit;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  select, button {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: .8rem 1rem;
    font: inherit;
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: #06231a; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .examples { display: flex; gap: .4rem; flex-wrap: wrap; }
  .examples button {
    font-size: .82rem; padding: .35rem .7rem; color: var(--muted);
    background: transparent; border-radius: 99px;
  }
  .examples button:hover { color: var(--ink); border-color: var(--accent); }

  .answer {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 1.25rem 1.4rem;
    margin-bottom: 1.5rem;
    white-space: pre-wrap;
  }
  .answer code, .src pre code { background: var(--panel-2); padding: .1em .35em; border-radius: 4px; font-size: .9em; }

  h2 { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 .75rem; }

  .src {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: .6rem;
    overflow: hidden;
  }
  .src summary {
    padding: .7rem 1rem;
    cursor: pointer;
    display: flex;
    gap: .75rem;
    align-items: baseline;
    font-size: .9rem;
  }
  .src summary::-webkit-details-marker { display: none; }
  .num { color: var(--accent); font-variant-numeric: tabular-nums; flex: none; }
  .path { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .score { color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; flex: none; }
  .src pre {
    margin: 0; padding: 0 1rem 1rem;
    color: var(--muted); font-size: .82rem; line-height: 1.6;
    white-space: pre-wrap; overflow-x: auto;
  }

  .status { color: var(--muted); font-size: .9rem; }
  .error { color: var(--warn); }
  .meta { color: var(--muted); font-size: .8rem; margin-top: 1.5rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>RAG Docs Assistant</h1>
    <p class="sub">Questions about FastAPI, answered only from the official docs &mdash; with the passages it used.</p>
  </header>

  <form id="form">
    <div class="row">
      <input type="text" id="q" placeholder="How do I return a custom status code?" autocomplete="off" required>
      <select id="strategy" title="Retrieval strategy">
        <option value="hybrid">hybrid</option>
        <option value="vector">vector</option>
        <option value="keyword">keyword</option>
      </select>
      <button type="submit" class="primary" id="askBtn">Ask</button>
      <button type="button" id="searchBtn" title="Retrieval only - no model call, no cost">Search only</button>
    </div>
    <div class="examples">
      <button type="button">How do I declare an optional query parameter?</button>
      <button type="button">What does response_model do?</button>
      <button type="button">How do I handle validation errors?</button>
      <button type="button">How do I run background tasks?</button>
    </div>
  </form>

  <div id="status" class="status"></div>
  <div id="answer"></div>
  <div id="sources"></div>
</div>

<script>
const form = document.getElementById("form");
const qEl = document.getElementById("q");
const strategyEl = document.getElementById("strategy");
const statusEl = document.getElementById("status");
const answerEl = document.getElementById("answer");
const sourcesEl = document.getElementById("sources");
const askBtn = document.getElementById("askBtn");
const searchBtn = document.getElementById("searchBtn");

document.querySelectorAll(".examples button").forEach(b => {
  b.addEventListener("click", () => { qEl.value = b.textContent; qEl.focus(); });
});

form.addEventListener("submit", e => { e.preventDefault(); run("/ask"); });
searchBtn.addEventListener("click", () => run("/search"));

function esc(s) {
  return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

async function run(endpoint) {
  const question = qEl.value.trim();
  if (!question) return;

  askBtn.disabled = searchBtn.disabled = true;
  statusEl.textContent = endpoint === "/ask" ? "Retrieving and generating…" : "Retrieving…";
  statusEl.className = "status";
  answerEl.innerHTML = "";
  sourcesEl.innerHTML = "";

  try {
    const res = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, strategy: strategyEl.value })
    });
    const data = await res.json();

    if (!res.ok) {
      statusEl.textContent = data.detail || `Request failed (${res.status})`;
      statusEl.className = "status error";
      return;
    }

    statusEl.textContent = "";

    if (data.answer) {
      answerEl.innerHTML = `<div class="answer">${esc(data.answer)}</div>`;
    }

    const results = data.sources || data.results || [];
    if (results.length) {
      const label = data.answer ? "Passages used" : "Retrieved passages";
      sourcesEl.innerHTML =
        `<h2>${label}</h2>` +
        results.map((r, i) => `
          <details class="src">
            <summary>
              <span class="num">[${i + 1}]</span>
              <span class="path">${esc(r.source)}</span>
              <span class="score">${r.score.toFixed(3)}</span>
            </summary>
            <pre>${esc(r.text)}</pre>
          </details>`).join("");
    }

    if (data.usage) {
      sourcesEl.insertAdjacentHTML("beforeend",
        `<p class="meta">${data.usage.input_tokens} input tokens &middot; ${data.usage.output_tokens} output tokens</p>`);
    }
  } catch (err) {
    statusEl.textContent = `Network error: ${err.message}`;
    statusEl.className = "status error";
  } finally {
    askBtn.disabled = searchBtn.disabled = false;
  }
}
</script>
</body>
</html>
